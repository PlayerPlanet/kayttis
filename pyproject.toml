# Virtual uv workspace root — no package of its own, only shared tooling config.
[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
