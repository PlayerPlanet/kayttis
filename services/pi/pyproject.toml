[project]
name = "kayttis-pi"
version = "0.1.0"
description = "Service running on the kahvibot Raspberry Pi: reads smart-home state and exposes it over HTTP."
readme = "README.md"
authors = [
    { name = "PlayerPlanet", email = "konsta.kiirikki@gmail.com" }
]
requires-python = ">=3.11"
dependencies = ["kayttis-core"]

[project.scripts]
kayttis-pi = "kayttis_pi:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
kayttis-core = { workspace = true }
