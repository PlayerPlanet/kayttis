<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0e">
  <title>Hanax · Koti</title>
  <link rel="icon" href="/brand/logo/hanax-mark-on-dark.svg" type="image/svg+xml">
  <link rel="preload" href="/brand/fonts/Geist-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/brand/tokens.css">
  <link rel="stylesheet" href="/app/app.css">
  <script type="module" src="/app/app.js"></script>
</head>
<body>
  <a class="skip" href="#rooms">Siirry huoneisiin</a>

  <header class="top">
    <div class="top-row">
      <a class="brand" href="/" aria-label="Hanax etusivu">
        <img src="/brand/logo/hanax-mark-on-dark.svg" alt="" width="28" height="28">
        <span class="spec">HX-P · KOTI</span>
      </a>
      <p class="live" id="live" data-state="connecting" title="Livedata killan keittiön antureista">
        <span class="live-dot" aria-hidden="true"></span><span id="live-text">Yhdistetään…</span>
      </p>
    </div>
    <div class="status">
      <h1 class="summary" id="summary" aria-live="polite">&nbsp;</h1>
      <p class="clock readout" id="clock" aria-hidden="true">--:--:--</p>
    </div>
  </header>

  <main id="rooms" class="rooms" aria-label="Huoneet"></main>

  <footer class="foot">
    <p class="spec">PROTOTYYPPI · KYTKENTÄ ON SIMULOITU SELAIMESSASI · OIKEITA LAITTEITA EI KOSKAAN KYTKETÄ</p>
    <button type="button" class="link" id="reset">Palauta demon alkutila</button>
  </footer>

  <!-- Floating actions: the knob (away: everything off) and add -->
  <button type="button" class="fab fab-away" id="away" aria-label="Poissa kotoa: sammuta kaikki laitteet" title="Poissa kotoa: kaikki pois">
    <span class="knob" aria-hidden="true"><span class="knob-pointer"></span></span>
    <span class="fab-label">Kaikki pois</span>
  </button>
  <button type="button" class="fab fab-add" id="add" aria-label="Lisää laite" title="Lisää laite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <!-- Camera sheet -->
  <dialog class="sheet" id="camera" aria-labelledby="cam-title">
    <div class="sheet-head">
      <div>
        <p class="spec">KAMERA · KILLAN KEITTIÖ</p>
        <h2 id="cam-title">Laite</h2>
        <p class="cam-meta" id="cam-meta"></p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Sulje kameranäkymä">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <figure class="cam-frame">
      <img id="cam-img" alt="" hidden>
      <div class="cam-empty" id="cam-empty">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3v12H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <p><strong>Kamera ei ole saatavilla</strong><br><span id="cam-empty-sub">Yritetään uudelleen muutaman sekunnin välein.</span></p>
      </div>
      <figcaption class="readout" id="cam-caption"></figcaption>
    </figure>
    <div class="sheet-actions">
      <button type="button" class="btn btn-primary" id="cam-toggle"></button>
      <button type="button" class="btn btn-quiet" id="cam-remove">Poista laite</button>
    </div>
  </dialog>

  <!-- Add device form -->
  <dialog class="sheet" id="adder" aria-labelledby="add-title">
    <form id="add-form" novalidate>
      <div class="sheet-head">
        <div>
          <p class="spec">UUSI LAITE</p>
          <h2 id="add-title">Lisää laite</h2>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Sulje lisäämättä">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="field">
        <label for="f-conn">Yhdistä anturiin</label>
        <select id="f-conn" name="connection" aria-describedby="f-conn-hint"></select>
        <p class="hint" id="f-conn-hint"></p>
      </div>

      <div class="field">
        <label for="f-name">Nimi</label>
        <input id="f-name" name="name" type="text" autocomplete="off" maxlength="40" aria-describedby="f-name-err" required>
        <p class="error" id="f-name-err" hidden>Anna laitteelle nimi.</p>
      </div>

      <div class="field">
        <label for="f-room">Huone</label>
        <select id="f-room" name="room"></select>
        <div class="new-room" id="new-room-wrap" hidden>
          <label for="f-newroom">Uuden huoneen nimi</label>
          <input id="f-newroom" name="newRoom" type="text" autocomplete="off" maxlength="30" aria-describedby="f-newroom-err">
          <p class="error" id="f-newroom-err" hidden>Anna uudelle huoneelle nimi.</p>
        </div>
      </div>

      <fieldset class="field types">
        <legend>Tyyppi</legend>
        <div class="type-options" id="f-types"></div>
      </fieldset>

      <div class="sheet-actions">
        <button type="submit" class="btn btn-primary">Lisää laite</button>
        <button type="button" class="btn btn-quiet" data-close>Peruuta</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" class="link" id="toast-undo" hidden>Kumoa</button>
  </div>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</body>
</html>
