<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<title>Hanax – Instagram 1/3 ongelma</title>
<link rel="stylesheet" href="hanax-print.css">
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1080px; --h: 1080px; }
  h1 { font-size: 168px; margin-top: 40px; }
  .row { display: grid; grid-template-columns: 520px 1fr; gap: 44px; margin-top: 52px; align-items: start; }
  .photo { height: 330px; border-radius: 28px; }
  .cap { display: flex; align-items: center; gap: 14px; margin-top: 16px; font-size: 24px; font-weight: 600; }
  .cap .chip { font-size: 20px; }
  .txt p { font-size: 34px; line-height: 1.32; }
  .txt p + p { margin-top: 22px; color: var(--muted); }
</style>
</head>
<body>
<div class="canvas">
  <div class="s-top"><img class="lockup" src="../../../brand/logo/hanax-lockup.svg" alt="Hanax"><div class="count"><span data-lights="0"></span>1 / 3</div></div>
  <h1 class="display">Jäikö hana<br>auki<span class="q">?</span></h1>
  <div class="row">
    <div><div class="photo"><img src="img/hana.jpg" alt="Keittiön hana auki"></div><div class="cap"><span data-chip="on"></span>Keittiön hana</div></div>
    <div class="txt">
      <p>Bussi lähtee neljän minuutin päästä. Ovi kiinni, ja ajatus jää eteiseen.</p>
      <p>Vesivahinko on kallis, eikä kotivakuutus aina korvaa sitä.</p>
    </div>
  </div>
  <div class="s-foot"><span class="mono">kayttis.kiirikki.fi</span><span>Aalto-yliopisto · Käytettävyys 2026</span></div>
</div>
<script src="components.js"></script>
</body>
</html>
