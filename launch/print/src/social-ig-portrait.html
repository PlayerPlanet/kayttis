<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<title>Hanax – Instagram pysty</title>
<link rel="stylesheet" href="hanax-print.css">
<link rel="stylesheet" href="social.css">
<style>
  :root { --w: 1080px; --h: 1350px; }
  .grid { display: grid; grid-template-columns: 1fr 430px; gap: 48px; margin-top: 64px; }
  h1 { font-size: 112px; line-height: 0.96; }
  .p { font-size: 34px; line-height: 1.34; margin-top: 34px; }
  .p b { font-weight: 600; }
  [data-panel] { font-size: 23px; }
  .tag { font-size: 96px; margin-top: auto; }
  .s-foot { margin-top: 40px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="s-top"><img class="lockup" src="../../../brand/logo/hanax-lockup.svg" alt="Hanax"><div class="count"><span data-lights=""></span></div></div>
  <div class="grid">
    <div>
      <h1 class="display">Tarkista kotisi bussista.</h1>
      <p class="p">Hanax näyttää puhelimessa, jäikö hana, liesi tai valot päälle.</p>
      <p class="p">Kun kaikki on kiinni, sen näkee heti. <b>Värillä, tekstillä ja ikonilla.</b></p>
    </div>
    <div data-panel="safe" data-variant="phone"></div>
  </div>
  <p class="display tag">Lähde kotoa huoletta.</p>
  <div class="s-foot"><span class="mono">kayttis.kiirikki.fi</span><span>Aalto-yliopisto · Käytettävyys 2026</span></div>
</div>
<script src="components.js"></script>
</body>
</html>
