<!doctype html>
<html lang="fi" data-theme="light">
<head>
<meta charset="utf-8">
<title>Hanax – pöytäkyltti (A5)</title>
<link rel="stylesheet" href="hanax-print.css">
<link rel="stylesheet" href="tent.css">
<style>
  @page { size: 210mm 148mm; margin: 0; }
  html, body { width: 210mm; height: 148mm; overflow: hidden; }
</style>
</head>
<body>
<div class="face">
  <div>
    <img class="lockup" src="../../../brand/logo/hanax-lockup.svg" alt="Hanax">
    <h1 class="display">Kokeile<br><span class="k">demoa.</span></h1>
    <p class="p">Avaa Hanax puhelimessa. Katso, mikä jäi päälle, ja sammuta kaikki yhdellä painikkeella.</p>
    <div class="login"><span class="knob dark"></span>Demotunnukset saat meiltä ständiltä</div>
    <div class="credit">Aalto-yliopisto · Käytettävyys 2026 · Ryhmä 1</div>
  </div>
  <div class="right">
    <div class="qrcard"><div class="qr"><img src="img/qr-app.svg" alt="QR-koodi: kayttis.kiirikki.fi/app/"></div></div>
    <div class="url">kayttis.kiirikki.fi/app/</div>
    <div class="scan">Skannaa puhelimen kameralla</div>
  </div>
</div>
<script src="components.js"></script>
</body>
</html>
